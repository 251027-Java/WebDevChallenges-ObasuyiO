<!DOCTYPE html>
<html>
  <head>
    <title>Greeting Input</title>
  </head>
  <body>
    <h2>Task 7</h2>
    <input type="number" id="numInput" placeholder="pick a number">
    <button onclick="square()">square it!</button>

    <script>
      function square() {
        let num = document.getElementById("numInput").value;
        if (num === "") {
            alert("enter a number");
        } else {
            x = num * num;
            alert("The square is " + x);
        }
      }
    </script>
  </body>
</html>
