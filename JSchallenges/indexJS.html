<!DOCTYPE html>
<html>
  <head>
    <title>JS Button Example</title>
  </head>
  <body>
    <h1>Click the Buttons!</h1>

    <button onclick="sayHello()">Say Hello</button>
    <button onclick="tellJoke()">Tell Joke</button>

    <script>
      function sayHello() {
        alert("Hello from JavaScript!");
      }

      function tellJoke() {
        alert("SIX SEVEN!!! 6 7 6 7 6 7!!!");
      }
    </script>
  </body>
</html>
